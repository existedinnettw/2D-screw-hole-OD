[project]
name = "two-d-screw-hole-od"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "insleker", email = "bkinnightskytw@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "clip",
    "einops>=0.8.1",
    "pillow>=12.2.0",
    "pycocotools>=2.0.10",
    "requests>=2.34.2",
    "sam-2",
    # "sam3",
    "torch==2.7.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.22.0",
    "transformers>=5.9.0",
    "ultralytics>=8.4.56",
]

[project.scripts]
two-d-screw-hole-od = "two_d_screw_hole_od:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=9.0.3",
    "pytest-html>=4.2.0",
    "ruff>=0.12.11",
    "ty>=0.0.1a17",
]

[tool.pytest.ini_options]
# pytest.ini
render_collapsed = false
log_cli = true
log_cli_level = "INFO"
markers = [
    "model_experiment: downloads model weights and runs live object detectors"
]

[tool.uv.sources]
clip = { git = "https://github.com/ultralytics/CLIP.git" }
sam-2 = { git = "https://github.com/facebookresearch/sam2.git" }
# sam3 = { git = "https://github.com/facebookresearch/sam3.git" }
